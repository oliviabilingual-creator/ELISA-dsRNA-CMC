<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dsRNA ELISA Analyzer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="root"></div>

<!--
  This is a plain, no-build-step website: it loads React, Recharts, XLSX,
  and a small in-browser JSX compiler (Babel) from a CDN, then runs
  script.js directly. That means an internet connection is required the
  first time each page loads (to fetch these libraries) — everything else
  (your data, calculations, exports) runs locally in your browser.
-->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react" data-type="script" src="script.js"></script>

</body>
</html>
